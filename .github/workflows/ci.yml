name: NOVA CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keep the newest run for each branch/event; never cancel a different branch.
  # Separate push and PR checks so required PR checks remain independently visible.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNOVA_BUILD_TESTS=ON -DNOVA_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install experimental NOVA SDK
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/nova-sdk"
      - name: Configure installed SDK consumer
        run: cmake -S tests/package_consumer -B build-package-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.temp }}/nova-sdk"
      - name: Build installed SDK consumer
        run: cmake --build build-package-consumer --config Release --parallel
      - name: Test installed SDK consumer
        run: ctest --test-dir build-package-consumer -C Release --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install thermal desktop client with tested Qt version
        run: python -m pip install ./desktop "PySide6-Essentials==6.8.3"
      - name: Exercise desktop authoring, solve, cancellation and field probes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python desktop/tests/test_desktop.py "${{ runner.temp }}/nova-sdk/bin"

  sanitize:
    name: Linux address, leak and undefined behavior checks
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-O1 -g1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-sanitize --parallel 3
      - run: ctest --test-dir build-sanitize --output-on-failure
