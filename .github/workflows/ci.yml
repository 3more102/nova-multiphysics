name: NOVA CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNOVA_BUILD_TESTS=ON -DNOVA_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install experimental NOVA SDK
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/nova-sdk"
      - name: Configure installed SDK consumer
        run: cmake -S tests/package_consumer -B build-package-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.temp }}/nova-sdk"
      - name: Build installed SDK consumer
        run: cmake --build build-package-consumer --config Release --parallel
      - name: Test installed SDK consumer
        run: ctest --test-dir build-package-consumer -C Release --output-on-failure
