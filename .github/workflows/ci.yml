name: NOVA CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNOVA_BUILD_TESTS=ON -DNOVA_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizer:
    name: Address, leak and undefined behavior checks
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-O1 -g1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-sanitize --parallel 3
      - run: ctest --test-dir build-sanitize --output-on-failure

  thermal-reference:
    name: Independent FEM comparison and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-fem==12.0.2 clang-tidy==23.1.4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNOVA_BUILD_TESTS=OFF
      - run: cmake --build build --target nova_transient_heat_3d nova_anisotropic_heat_3d --parallel 3
      - run: python verification/compare_transient_heat_3d.py ./build/nova_transient_heat_3d
      - run: python verification/compare_adaptive_heat_3d.py ./build/nova_anisotropic_heat_3d
      - name: Check numerical translation units
        run: >-
          clang-tidy
          --checks='-*,clang-analyzer-core.*,clang-analyzer-cplusplus.*,bugprone-use-after-move,bugprone-dangling-handle,performance-for-range-copy'
          --warnings-as-errors='*' --header-filter='.*(include/nova|src/fem)/.*'
          src/fem/heat_time_integration.cpp src/fem/transient_heat_3d.cpp src/fem/transient_heat_2d.cpp src/fem/adaptive_heat_3d.cpp
          src/fem/conductivity_3d.cpp src/fem/diffusion_3d.cpp src/fem/mesh3d.cpp src/fem/h1_space_3d.cpp
          src/fem/diffusion_h1_2d.cpp src/fem/diffusion_nullspace.cpp src/fem/constrained_diffusion.cpp src/fem/mesh2d.cpp
          -- -std=c++20 -Iinclude
